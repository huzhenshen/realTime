<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>光影日记 · 记录生活轮播图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f5f0e7 0%, #e8dfd3 100%);
            font-family: 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        /* 主卡片容器 */
        .life-story-card {
            max-width: 1200px;
            width: 100%;
            background: #fffef7;
            border-radius: 3rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* 头部诗意描述 */
        .memories-header {
            text-align: center;
            padding: 2rem 2rem 1rem 2rem;
            background: #fffdf9;
            border-bottom: 1px solid #f0e4d4;
        }

        .memories-header h1 {
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #5e4b3a, #b47c5e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .memories-header p {
            color: #8b7a6b;
            margin-top: 0.6rem;
            font-size: 1rem;
            font-style: italic;
            border-top: 1px dashed #eddccb;
            display: inline-block;
            padding-top: 0.6rem;
        }

        /* 轮播图核心区域 */
        .carousel-container {
            position: relative;
            width: 100%;
            background: #2c241e;
            overflow: hidden;
            user-select: none;
        }

        .carousel-track-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .carousel-slide {
            flex: 0 0 100%;
            position: relative;
            aspect-ratio: 16 / 10;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #d9cdbc;
        }

        /* 生活记录字幕 — 半透明浮层 */
        .life-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.2), transparent);
            color: white;
            padding: 1.5rem 2rem 1.2rem 2rem;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
            font-weight: 400;
            pointer-events: none;
            transition: all 0.2s;
        }

        .life-caption .date {
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.9;
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            margin-bottom: 0.5rem;
        }

        .life-caption .desc {
            font-size: 1.3rem;
            font-weight: 500;
            line-height: 1.3;
            max-width: 85%;
        }

        @media (max-width: 700px) {
            .life-caption .desc {
                font-size: 1rem;
                max-width: 100%;
            }

            .life-caption {
                padding: 1rem 1.2rem;
            }
        }

        /* 导航按钮 */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(30, 25, 22, 0.6);
            backdrop-filter: blur(6px);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 20;
            opacity: 0.7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .carousel-btn:hover {
            background: rgba(100, 70, 55, 0.85);
            opacity: 1;
            transform: translateY(-50%) scale(1.02);
        }

        .btn-prev {
            left: 20px;
        }

        .btn-next {
            right: 20px;
        }

        /* 指示器小圆点 */
        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 1.2rem 1rem 1.6rem;
            background: #fffef7;
            flex-wrap: wrap;
            align-items: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #dbcbbd;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            padding: 0;
            margin: 0 4px;
        }

        .dot.active {
            width: 26px;
            background: #b47c5e;
            border-radius: 20px;
        }

        .life-counter {
            margin-left: 18px;
            font-size: 0.85rem;
            background: #f4ede5;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            color: #6b4e3a;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 寄语区域 */
        .footer-note {
            background: #fff9f2;
            padding: 1rem 2rem 1.8rem;
            text-align: center;
            border-top: 1px solid #f0e2d4;
            font-size: 0.9rem;
            color: #9b897a;
        }

        .footer-note span {
            font-family: 'Georgia', serif;
        }

        /* ========== 音乐播放器样式 ========== */
        .music-player {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
        }

        .music-btn {
            background: rgba(180, 124, 94, 0.88);
            backdrop-filter: blur(10px);
            padding: 10px 18px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .music-btn:hover {
            background: rgba(100, 70, 55, 0.96);
            transform: scale(1.03);
        }

        .music-icon {
            font-size: 18px;
            transition: all 0.2s;
        }

        /* 播放时的动画效果 */
        .music-btn.playing .music-icon {
            animation: musicWave 0.8s ease infinite;
        }

        @keyframes musicWave {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
                text-shadow: 0 0 8px rgba(255, 215, 180, 0.9);
            }
        }

        @media (max-width: 600px) {
            .memories-header h1 {
                font-size: 1.6rem;
            }

            .carousel-btn {
                width: 36px;
                height: 36px;
                font-size: 1.4rem;
            }

            .music-btn {
                padding: 7px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="life-story-card">
        <div class="memories-header">
            <h1>📖 生活回忆 · 片刻集</h1>
            <p>每一帧都是时间的礼物，记录那些温柔日常</p>
        </div>

        <div class="carousel-container">
            <div class="carousel-track-wrapper">
                <div class="carousel-track" id="carouselTrack">
                </div>
            </div>
            <button class="carousel-btn btn-prev" id="prevBtn" aria-label="上一张">‹</button>
            <button class="carousel-btn btn-next" id="nextBtn" aria-label="下一张">›</button>
        </div>

        <div class="carousel-indicators" id="indicatorsContainer">
        </div>

        <div class="footer-note">
            <span>✨ 翻看走过的光影，把生活写成诗 ✨</span>
        </div>
    </div>

    <!-- 音乐播放器 -->
    <div class="music-player">
        <div class="music-btn" id="musicBtn">
            <span class="music-icon">♪</span>
            <span class="music-text">🎵 生活BGM</span>
        </div>
        <audio id="bgMusic" loop preload="auto">
            <!-- 使用稳定可靠的轻音乐资源 -->
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        // ==================== 音乐控制模块 ====================
        (function initMusic() {
            const musicBtn = document.getElementById('musicBtn');
            const audio = document.getElementById('bgMusic');
            let isPlaying = false;
            let autoPlayAttempted = false;

            // 设置音量为30%，轻柔舒适
            audio.volume = 0.28;

            // 尝试自动播放（需要用户首次交互）
            function attemptAutoPlay() {
                if (autoPlayAttempted) return;
                autoPlayAttempted = true;

                audio.play().then(() => {
                    isPlaying = true;
                    musicBtn.classList.add('playing');
                    musicBtn.querySelector('.music-icon').textContent = '♫';
                }).catch(() => {
                    // 自动播放被浏览器阻止，等待用户点击
                    isPlaying = false;
                    musicBtn.classList.remove('playing');
                    musicBtn.querySelector('.music-icon').textContent = '♪';
                });
            }

            // 点击按钮切换播放/暂停
            musicBtn.addEventListener('click', function (e) {
                e.stopPropagation();

                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    musicBtn.classList.remove('playing');
                    musicBtn.querySelector('.music-icon').textContent = '♪';
                } else {
                    audio.play().then(() => {
                        isPlaying = true;
                        musicBtn.classList.add('playing');
                        musicBtn.querySelector('.music-icon').textContent = '♫';
                    }).catch(err => {
                        console.log('播放需要用户交互:', err);
                    });
                }
            });

            // 页面任何位置点击都尝试启动音乐（优雅解决浏览器策略）
            const startMusicOnInteraction = function () {
                attemptAutoPlay();
                document.removeEventListener('click', startMusicOnInteraction);
                document.removeEventListener('touchstart', startMusicOnInteraction);
            };
            document.addEventListener('click', startMusicOnInteraction);
            document.addEventListener('touchstart', startMusicOnInteraction);

            // 音乐播放结束时重新播放（loop备选）
            audio.addEventListener('ended', function () {
                if (isPlaying) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log('重播失败'));
                }
            });

            // 页面隐藏时暂停，恢复时继续（节省资源）
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    if (isPlaying) {
                        audio.pause();
                    }
                } else {
                    if (isPlaying) {
                        audio.play().catch(e => console.log('恢复播放失败'));
                    }
                }
            });
        })();

        // ==================== 轮播图数据 ====================
        const memoriesData = [
            {
                imgUrl: "https://images.pexels.com/photos/6238048/pexels-photo-6238048.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2025 · 深秋",
                description: "街角咖啡店的老唱片，转着旧时光的旋律。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/4050290/pexels-photo-4050290.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2025 · 初冬",
                description: "黄昏里的书页，被夕阳镀上一层蜜糖色。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/6352792/pexels-photo-6352792.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2026 · 暖春",
                description: "阳台的多肉又冒新芽，日子在悄悄生长。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/4021779/pexels-photo-4021779.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2024 · 盛夏",
                description: "雨后池塘，听见童年的蛙鸣和笑语。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/6168333/pexels-photo-6168333.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2025 · 秋分",
                description: "第一次烘焙成功，厨房里全是黄油香气。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/6437587/pexels-photo-6437587.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2025 · 冬夜",
                description: "和朋友窝在沙发看老电影，笑到流泪。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/6747370/pexels-photo-6747370.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2026 · 春日",
                description: "樱花树下，猫咪踩过落花，世界柔软。"
            }
        ];

        // DOM 元素
        const track = document.getElementById('carouselTrack');
        const indicatorsContainer = document.getElementById('indicatorsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentIndex = 0;
        let slideCount = memoriesData.length;
        let autoInterval = null;
        const AUTO_SWITCH_DELAY = 5000;

        // 构建轮播图
        function buildCarousel() {
            track.innerHTML = '';
            memoriesData.forEach((item, idx) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'carousel-slide';
                const img = document.createElement('img');
                img.src = item.imgUrl;
                img.alt = `生活回忆-${idx + 1}`;
                img.loading = idx === 0 ? "eager" : "lazy";
                const captionDiv = document.createElement('div');
                captionDiv.className = 'life-caption';
                const dateSpan = document.createElement('div');
                dateSpan.className = 'date';
                dateSpan.textContent = item.date;
                const descSpan = document.createElement('div');
                descSpan.className = 'desc';
                descSpan.textContent = item.description;
                captionDiv.appendChild(dateSpan);
                captionDiv.appendChild(descSpan);
                slideDiv.appendChild(img);
                slideDiv.appendChild(captionDiv);
                track.appendChild(slideDiv);
            });
        }

        // 生成指示器
        function buildIndicators() {
            indicatorsContainer.innerHTML = '';
            for (let i = 0; i < slideCount; i++) {
                const dot = document.createElement('button');
                dot.classList.add('dot');
                dot.setAttribute('data-index', i);
                dot.addEventListener('click', () => {
                    stopAutoPlay();
                    goToSlide(i);
                    startAutoPlay();
                });
                indicatorsContainer.appendChild(dot);
            }
            const counterSpan = document.createElement('span');
            counterSpan.className = 'life-counter';
            counterSpan.id = 'lifeCounter';
            indicatorsContainer.appendChild(counterSpan);
            updateIndicatorsAndCounter();
        }

        function updateIndicatorsAndCounter() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                if (idx === currentIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
            const counterSpan = document.getElementById('lifeCounter');
            if (counterSpan) {
                counterSpan.textContent = `${currentIndex + 1} / ${slideCount} · 生活印记`;
            }
        }

        function goToSlide(index) {
            if (index < 0) {
                index = slideCount - 1;
            } else if (index >= slideCount) {
                index = 0;
            }
            currentIndex = index;
            const translateX = -currentIndex * 100;
            track.style.transform = `translateX(${translateX}%)`;
            updateIndicatorsAndCounter();

            // 动态改变页面标题（小彩蛋）
            const currentMemo = memoriesData[currentIndex];
            if (currentMemo) {
                document.title = `📸 ${currentMemo.description.substring(0, 24)} · 光影日记`;
            }
        }

        function nextSlide() {
            goToSlide(currentIndex + 1);
        }

        function prevSlide() {
            goToSlide(currentIndex - 1);
        }

        function startAutoPlay() {
            if (autoInterval) clearInterval(autoInterval);
            autoInterval = setInterval(() => {
                nextSlide();
            }, AUTO_SWITCH_DELAY);
        }

        function stopAutoPlay() {
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
            }
        }

        // 悬停暂停
        function setupHoverPause() {
            const container = document.querySelector('.carousel-container');
            if (!container) return;
            container.addEventListener('mouseenter', () => {
                stopAutoPlay();
            });
            container.addEventListener('mouseleave', () => {
                startAutoPlay();
            });
            container.addEventListener('touchstart', () => {
                stopAutoPlay();
            });
            container.addEventListener('touchend', () => {
                setTimeout(() => {
                    if (!autoInterval) startAutoPlay();
                }, 1500);
            });
        }

        // 键盘控制
        function setupKeyboardNavigation() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    stopAutoPlay();
                    prevSlide();
                    startAutoPlay();
                    e.preventDefault();
                } else if (e.key === 'ArrowRight') {
                    stopAutoPlay();
                    nextSlide();
                    startAutoPlay();
                    e.preventDefault();
                }
            });
        }

        // 预加载图片
        function preloadAdjacentImages() {
            const preloadImage = (url) => {
                const img = new Image();
                img.src = url;
            };
            const nextIdx = (currentIndex + 1) % slideCount;
            const prevIdx = (currentIndex - 1 + slideCount) % slideCount;
            if (memoriesData[nextIdx]) preloadImage(memoriesData[nextIdx].imgUrl);
            if (memoriesData[prevIdx]) preloadImage(memoriesData[prevIdx].imgUrl);
        }

        // 绑定按钮事件
        function bindEvents() {
            const newPrev = prevBtn.cloneNode(true);
            const newNext = nextBtn.cloneNode(true);
            prevBtn.parentNode.replaceChild(newPrev, prevBtn);
            nextBtn.parentNode.replaceChild(newNext, nextBtn);

            newPrev.addEventListener('click', (e) => {
                e.stopPropagation();
                stopAutoPlay();
                prevSlide();
                startAutoPlay();
            });
            newNext.addEventListener('click', (e) => {
                e.stopPropagation();
                stopAutoPlay();
                nextSlide();
                startAutoPlay();
            });
        }

        // 触摸滑动
        function setupSwipe() {
            let touchStartX = 0;
            let touchEndX = 0;
            const container = document.querySelector('.carousel-track-wrapper');
            if (!container) return;
            container.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                stopAutoPlay();
            }, { passive: false });
            container.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const deltaX = touchEndX - touchStartX;
                if (Math.abs(deltaX) > 50) {
                    if (deltaX > 0) {
                        prevSlide();
                    } else {
                        nextSlide();
                    }
                }
                setTimeout(() => {
                    if (!autoInterval) startAutoPlay();
                }, 1000);
            });
        }

        // 初始化
        function init() {
            buildCarousel();
            buildIndicators();
            currentIndex = 0;
            track.style.transform = 'translateX(0%)';
            updateIndicatorsAndCounter();
            bindEvents();
            startAutoPlay();
            setupHoverPause();
            setupKeyboardNavigation();
            setupSwipe();
            preloadAdjacentImages();

            if (memoriesData[0]) {
                document.title = `📸 ${memoriesData[0].description.substring(0, 24)} · 光影日记`;
            }

            // 图片加载失败备用
            const allImgs = document.querySelectorAll('.carousel-slide img');
            allImgs.forEach(img => {
                img.onerror = function () {
                    this.src = "https://placehold.co/1200x800/f2e8de/b48c5e?text=生活回忆";
                    this.style.objectFit = "cover";
                };
            });
        }

        init();
    </script>
</body>

</html>
