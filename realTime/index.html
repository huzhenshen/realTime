<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>光影日记 · 记录生活轮播图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f5f0e7 0%, #e8dfd3 100%);
            font-family: 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        /* 主卡片容器 */
        .life-story-card {
            max-width: 1200px;
            width: 100%;
            background: #fffef7;
            border-radius: 3rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* 头部诗意描述 */
        .memories-header {
            text-align: center;
            padding: 2rem 2rem 1rem 2rem;
            background: #fffdf9;
            border-bottom: 1px solid #f0e4d4;
        }

        .memories-header h1 {
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #5e4b3a, #b47c5e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .memories-header p {
            color: #8b7a6b;
            margin-top: 0.6rem;
            font-size: 1rem;
            font-style: italic;
            border-top: 1px dashed #eddccb;
            display: inline-block;
            padding-top: 0.6rem;
        }

        /* 轮播图核心区域 */
        .carousel-container {
            position: relative;
            width: 100%;
            background: #2c241e;
            overflow: hidden;
            user-select: none;
        }

        .carousel-track-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .carousel-slide {
            flex: 0 0 100%;
            position: relative;
            aspect-ratio: 16 / 10;
            /* 宽高比优雅适配 */
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #d9cdbc;
            /* 加载占位 */
        }

        /* 生活记录字幕 — 半透明浮层 */
        .life-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.2), transparent);
            color: white;
            padding: 1.5rem 2rem 1.2rem 2rem;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
            font-weight: 400;
            pointer-events: none;
            transition: all 0.2s;
        }

        .life-caption .date {
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.9;
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            margin-bottom: 0.5rem;
        }

        .life-caption .desc {
            font-size: 1.3rem;
            font-weight: 500;
            line-height: 1.3;
            max-width: 85%;
        }

        @media (max-width: 700px) {
            .life-caption .desc {
                font-size: 1rem;
                max-width: 100%;
            }

            .life-caption {
                padding: 1rem 1.2rem;
            }
        }

        /* 导航按钮 (左右箭头) */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(30, 25, 22, 0.6);
            backdrop-filter: blur(6px);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 20;
            opacity: 0.7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .carousel-btn:hover {
            background: rgba(100, 70, 55, 0.85);
            opacity: 1;
            transform: translateY(-50%) scale(1.02);
        }

        .btn-prev {
            left: 20px;
        }

        .btn-next {
            right: 20px;
        }

        /* 指示器小圆点 + 生活计数器 */
        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 1.2rem 1rem 1.6rem;
            background: #fffef7;
            flex-wrap: wrap;
            align-items: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #dbcbbd;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            padding: 0;
            margin: 0 4px;
        }

        .dot.active {
            width: 26px;
            background: #b47c5e;
            border-radius: 20px;
        }

        .life-counter {
            margin-left: 18px;
            font-size: 0.85rem;
            background: #f4ede5;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            color: #6b4e3a;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 下方寄语区域 */
        .footer-note {
            background: #fff9f2;
            padding: 1rem 2rem 1.8rem;
            text-align: center;
            border-top: 1px solid #f0e2d4;
            font-size: 0.9rem;
            color: #9b897a;
        }

        .footer-note span {
            font-family: 'Georgia', serif;
        }

        @media (max-width: 600px) {
            .memories-header h1 {
                font-size: 1.6rem;
            }

            .carousel-btn {
                width: 36px;
                height: 36px;
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>

    <div class="life-story-card">
        <div class="memories-header">
            <h1>📖 生活回忆 · 片刻集</h1>
            <p>每一帧都是时间的礼物，记录那些温柔日常</p>
        </div>

        <div class="carousel-container">
            <div class="carousel-track-wrapper">
                <div class="carousel-track" id="carouselTrack">
                    <!-- 轮播图片 + 生活描述动态插入 js 动态渲染, 但为了方便直接在html中结构化也可, 但使用js注入统一管理图片列表和描述 -->
                </div>
            </div>
            <!-- 左右按钮 -->
            <button class="carousel-btn btn-prev" id="prevBtn" aria-label="上一张">‹</button>
            <button class="carousel-btn btn-next" id="nextBtn" aria-label="下一张">›</button>
        </div>

        <div class="carousel-indicators" id="indicatorsContainer">
            <!-- 动态生成点状指示器 + 计数器 -->
        </div>

        <div class="footer-note">
            <span>✨ 翻看走过的光影，把生活写成诗 ✨</span>
        </div>
    </div>

    <script>
        // --------------------------------------------------------------
        // 生活图片数据 —— 每一张图片 + 日期 + 生活回忆文案 (记录生活)
        // 使用高质量 Unsplash 生活向摄影图 (均为可商用风格图片，仅作展示)
        // 图片源皆来自 reliable 稳定图片服务 (快速加载且风格温暖)
        // 所有配图与生活回忆主题契合: 日常、街角、咖啡、植物、旧物、天空、笑容等
        // --------------------------------------------------------------
        const memoriesData = [
            {
                imgUrl: "https://images.pexels.com/photos/6238048/pexels-photo-6238048.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2025 · 深秋",
                description: "街角咖啡店的老唱片，转着旧时光的旋律。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/4050290/pexels-photo-4050290.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2025 · 初冬",
                description: "黄昏里的书页，被夕阳镀上一层蜜糖色。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/6352792/pexels-photo-6352792.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2026 · 暖春",
                description: "阳台的多肉又冒新芽，日子在悄悄生长。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/4021779/pexels-photo-4021779.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2024 · 盛夏",
                description: "雨后池塘，听见童年的蛙鸣和笑语。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/6168333/pexels-photo-6168333.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2025 · 秋分",
                description: "第一次烘焙成功，厨房里全是黄油香气。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/6437587/pexels-photo-6437587.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2025 · 冬夜",
                description: "和朋友窝在沙发看老电影，笑到流泪。"
            },
            {
                imgUrl: "https://images.pexels.com/photos/6747370/pexels-photo-6747370.jpeg?auto=compress&cs=tinysrgb&w=1200&h=800&fit=crop",
                date: "2026 · 春日",
                description: "樱花树下，猫咪踩过落花，世界柔软。"
            }
        ];

        // DOM 元素
        const track = document.getElementById('carouselTrack');
        const indicatorsContainer = document.getElementById('indicatorsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentIndex = 0;
        let slideCount = memoriesData.length;
        let autoInterval = null;
        const AUTO_SWITCH_DELAY = 5000; // 5秒自动切换

        // 初始化渲染轮播图结构 (图片 + 生活字幕浮层)
        function buildCarousel() {
            track.innerHTML = ''; // 清空
            memoriesData.forEach((item, idx) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'carousel-slide';
                // 图片元素
                const img = document.createElement('img');
                img.src = item.imgUrl;
                img.alt = `生活回忆-${idx + 1}`;
                img.loading = idx === 0 ? "eager" : "lazy";
                // 生活记录浮层 (caption)
                const captionDiv = document.createElement('div');
                captionDiv.className = 'life-caption';
                const dateSpan = document.createElement('div');
                dateSpan.className = 'date';
                dateSpan.textContent = item.date;
                const descSpan = document.createElement('div');
                descSpan.className = 'desc';
                descSpan.textContent = item.description;
                captionDiv.appendChild(dateSpan);
                captionDiv.appendChild(descSpan);
                slideDiv.appendChild(img);
                slideDiv.appendChild(captionDiv);
                track.appendChild(slideDiv);
            });
        }

        // 生成指示器小圆点 + 生活计数信息
        function buildIndicators() {
            indicatorsContainer.innerHTML = '';
            // 创建 dots 组
            for (let i = 0; i < slideCount; i++) {
                const dot = document.createElement('button');
                dot.classList.add('dot');
                dot.setAttribute('data-index', i);
                dot.addEventListener('click', () => {
                    stopAutoPlay();
                    goToSlide(i);
                    startAutoPlay();
                });
                indicatorsContainer.appendChild(dot);
            }
            // 添加生活计数器 (显示第几张 / 总共几张)
            const counterSpan = document.createElement('span');
            counterSpan.className = 'life-counter';
            counterSpan.id = 'lifeCounter';
            indicatorsContainer.appendChild(counterSpan);
            updateIndicatorsAndCounter();
        }

        // 更新圆点active样式 + 更新文字计数器
        function updateIndicatorsAndCounter() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                if (idx === currentIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
            const counterSpan = document.getElementById('lifeCounter');
            if (counterSpan) {
                counterSpan.textContent = `${currentIndex + 1} / ${slideCount} · 生活印记`;
            }
        }

        // 核心滑动函数
        function goToSlide(index) {
            // 边界循环处理 (无缝循环)
            if (index < 0) {
                index = slideCount - 1;
            } else if (index >= slideCount) {
                index = 0;
            }
            currentIndex = index;
            const translateX = -currentIndex * 100;
            track.style.transform = `translateX(${translateX}%)`;
            updateIndicatorsAndCounter();
        }

        // 下一张
        function nextSlide() {
            goToSlide(currentIndex + 1);
        }

        // 上一张
        function prevSlide() {
            goToSlide(currentIndex - 1);
        }

        // 自动轮播启动
        function startAutoPlay() {
            if (autoInterval) clearInterval(autoInterval);
            autoInterval = setInterval(() => {
                nextSlide();
            }, AUTO_SWITCH_DELAY);
        }

        function stopAutoPlay() {
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
            }
        }

        // 鼠标/触摸悬停时暂停自动播放，离开恢复 (增强体验)
        function setupHoverPause() {
            const container = document.querySelector('.carousel-container');
            if (!container) return;
            container.addEventListener('mouseenter', () => {
                stopAutoPlay();
            });
            container.addEventListener('mouseleave', () => {
                startAutoPlay();
            });
            // 移动端触摸时同样暂停自动播放，避免混乱
            container.addEventListener('touchstart', () => {
                stopAutoPlay();
            });
            container.addEventListener('touchend', () => {
                // 延迟启动，避免快速滑动后立即自动播放干扰
                setTimeout(() => {
                    if (!autoInterval) startAutoPlay();
                }, 1500);
            });
        }

        // 键盘支持：左右方向键切换
        function setupKeyboardNavigation() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    stopAutoPlay();
                    prevSlide();
                    startAutoPlay();
                    e.preventDefault();
                } else if (e.key === 'ArrowRight') {
                    stopAutoPlay();
                    nextSlide();
                    startAutoPlay();
                    e.preventDefault();
                }
            });
        }

        // 预加载优化: 只预加载附近两张图片 (温柔性能)
        function preloadAdjacentImages() {
            // 利用浏览器原生prefetch或者简单在空闲时加载后续图片资源，因为我们使用了lazy，无需额外强制
            // 但为了提高体验，在每次切换后，提前加载下一张和上一张的图片（如果尚未加载）
            const preloadImage = (url) => {
                const img = new Image();
                img.src = url;
            };
            const nextIdx = (currentIndex + 1) % slideCount;
            const prevIdx = (currentIndex - 1 + slideCount) % slideCount;
            if (memoriesData[nextIdx]) preloadImage(memoriesData[nextIdx].imgUrl);
            if (memoriesData[prevIdx]) preloadImage(memoriesData[prevIdx].imgUrl);
        }

        // 每次滑动后预加载周边图片，并且更新当前图片描述微动态（可选，增强）
        function onSlideAfterEffects() {
            preloadAdjacentImages();
            // 可以增加轻量触觉反馈（可选），不做复杂处理
            // 修改document标题展示当前回忆（小彩蛋）
            const currentMemo = memoriesData[currentIndex];
            if (currentMemo) {
                // 动态 title 显示生活随笔感 (不影响主功能)
                document.title = `📸 生活回忆 · ${currentMemo.description.substring(0, 28)}`;
            }
        }

        // 包装goToSlide并触发额外效果
        const originalGoToSlide = goToSlide;
        window.goToSlide = function (index) {
            originalGoToSlide(index);
            onSlideAfterEffects();
        };
        // 重写函数确保效果
        goToSlide = function (index) {
            if (index < 0) index = slideCount - 1;
            if (index >= slideCount) index = 0;
            currentIndex = index;
            const translateX = -currentIndex * 100;
            track.style.transform = `translateX(${translateX}%)`;
            updateIndicatorsAndCounter();
            onSlideAfterEffects();
        };

        // 让next和prev调用新goToSlide
        window.nextSlide = function () { goToSlide(currentIndex + 1); };
        window.prevSlide = function () { goToSlide(currentIndex - 1); };
        // 替换按钮事件
        function bindEvents() {
            // 解除原有可能事件，重新绑定
            const newPrev = prevBtn.cloneNode(true);
            const newNext = nextBtn.cloneNode(true);
            prevBtn.parentNode.replaceChild(newPrev, prevBtn);
            nextBtn.parentNode.replaceChild(newNext, nextBtn);
            window.prevBtn = newPrev;
            window.nextBtn = newNext;
            newPrev.addEventListener('click', (e) => {
                e.stopPropagation();
                stopAutoPlay();
                prevSlide();
                startAutoPlay();
            });
            newNext.addEventListener('click', (e) => {
                e.stopPropagation();
                stopAutoPlay();
                nextSlide();
                startAutoPlay();
            });
        }

        // 处理窗口大小改变时轮播位置修正 (防止变形)
        function handleResize() {
            // 重新设置transform 确保当前索引位置正确（因宽高比变化不会偏移位置）
            const translateX = -currentIndex * 100;
            track.style.transform = `translateX(${translateX}%)`;
        }

        // 移动端手势支持：轻滑切换（简易touch事件）
        function setupSwipe() {
            let touchStartX = 0;
            let touchEndX = 0;
            const container = document.querySelector('.carousel-track-wrapper');
            if (!container) return;
            container.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                stopAutoPlay();
            }, { passive: false });
            container.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const deltaX = touchEndX - touchStartX;
                if (Math.abs(deltaX) > 50) {
                    if (deltaX > 0) {
                        // 右滑 -> 上一张
                        prevSlide();
                    } else {
                        // 左滑 -> 下一张
                        nextSlide();
                    }
                }
                // 重启自动播放，但延迟一点，避免连续滑动冲突
                setTimeout(() => {
                    if (!autoInterval) startAutoPlay();
                }, 1000);
            });
            container.addEventListener('touchcancel', () => {
                setTimeout(() => {
                    if (!autoInterval) startAutoPlay();
                }, 800);
            });
        }

        // 初始化页面，并确保第一张图配合生活记录浮层样式
        function init() {
            buildCarousel();          // 构建幻灯片
            buildIndicators();       // 构建指示器+计数器
            // 确保初始位置为0
            currentIndex = 0;
            track.style.transform = 'translateX(0%)';
            updateIndicatorsAndCounter();
            bindEvents();            // 绑定左右按钮
            startAutoPlay();         // 开启自动轮播
            setupHoverPause();       // 悬停暂停
            setupKeyboardNavigation(); // 键盘左右
            setupSwipe();            // 移动端滑动
            window.addEventListener('resize', handleResize);
            // 预加载第一张相邻图片
            preloadAdjacentImages();
            // 设置初始title
            if (memoriesData[0]) {
                document.title = `📸 生活回忆 · ${memoriesData[0].description.substring(0, 28)}`;
            }
            // 小优化：为所有图片添加一个图片加载失败占位提示
            const allImgs = document.querySelectorAll('.carousel-slide img');
            allImgs.forEach(img => {
                img.onerror = function () {
                    this.src = "https://placehold.co/1200x800/f2e8de/b48c5e?text=生活回忆+温暖加载";
                    this.style.objectFit = "cover";
                };
            });
        }

        // 启动一切
        init();
    </script>
</body>

</html>
